[package]
name = "vocab"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
directories = "6.0.0"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
# rustls rather than the platform's TLS, so the binary carries everything it
# needs to reach DeepSeek wherever it is installed.
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "time", "net"] }

[dev-dependencies]
tempfile = "3.27.0"
